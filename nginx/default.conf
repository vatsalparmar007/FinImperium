# Reverse proxy in front of the Next.js container.
# In Phase 5 (blue-green), the deploy script switches this upstream between
# the "blue" and "green" app containers and reloads Nginx with no downtime.
upstream finimperium {
    server app:3000;
    keepalive 16;
}

server {
    listen 80;
    server_name _;

    # Receipt uploads go through Server Actions (limit set to 5 MB in next.config.mjs).
    client_max_body_size 6m;

    gzip on;
    gzip_types text/plain text/css application/json application/javascript image/svg+xml;

    # Nginx's own liveness check (does not touch the app).
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        proxy_pass http://finimperium;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # Built JS/CSS files have content hashes in their names, so they can be cached for a long time.
    location /_next/static/ {
        proxy_pass http://finimperium;
        proxy_set_header Host $host;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
